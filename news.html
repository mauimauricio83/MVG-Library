<style>
  :root {
    --bg: #121214;
    --surface: #1b1b1e;
    --border: #2c2c30;
    --text: #f1f1f2;
    --text-muted: #a5a5ad;
    --text-faint: #77777f;
    --accent: #a855f7;
    --accent-soft: #2a1150;
    --yellow: #f5e300;
    --radius: 10px;
  }
  :root[data-theme="light"] {
    --bg: #fafafa;
    --surface: #ffffff;
    --border: #e4e4e7;
    --text: #18181b;
    --text-muted: #6b6b73;
    --text-faint: #9a9aa2;
    --accent: #4a0d8f;
    --accent-soft: #efe4fb;
    --yellow: #a68900;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
  }

  body {
    font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    line-height: 1.6;
  }

  a { color: var(--accent); }

  /* No max-width by default -- the listing view should fill .app's full
     width exactly like the homepage's News section does (that section's
     .blog-latest-sidebar lives directly in .app, which has no cap of its
     own). Only the single-post reading view constrains width, via
     main.has-sidebar below. */
  main {
    margin: 0 auto;
    padding: 32px 20px 80px;
  }

  .page-title {
    font-family: "Archivo Black", sans-serif;
    font-weight: 400;
    font-size: clamp(1.8rem, 4vw, 2.6rem);
    color: var(--yellow);
    margin: 0 0 8px;
  }

  .page-intro {
    color: var(--text-muted);
    margin: 0 0 32px;
    max-width: 60ch;
  }

  /* The 6 big cards reuse styles.css's .spotlight-card / .blog-latest-card
     (and their .spotlight-card-thumb / .spotlight-card-info /
     .spotlight-card-song / .blog-latest-excerpt children) directly, so
     they render pixel-identical to the homepage's "News" cards -- just in
     a wider 3-column grid since this page has the full width to use,
     instead of the homepage sidebar's cramped 2 columns. */
  .post-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 20px;
    margin-bottom: 8px;
  }

  .post-card-date {
    margin-top: 4px;
    font-size: 0.72rem;
    color: var(--text-faint);
  }

  @media (max-width: 900px) {
    .post-grid {
      grid-template-columns: repeat(2, 1fr);
    }
  }

  @media (max-width: 560px) {
    .post-grid {
      grid-template-columns: 1fr;
    }
  }

  .empty-state {
    color: var(--text-faint);
    padding: 40px 0;
    text-align: center;
  }

  /* Skeleton loaders -- shimmering placeholder shapes shown while Firestore
     data is in flight, instead of a bare "Loading…" string. Every skeleton
     piece is sized to match the real element it stands in for (card, list
     row, comment, article) so there's no layout jump when real content
     swaps in. */
  @keyframes skel-shimmer {
    0% { background-position: -300px 0; }
    100% { background-position: 300px 0; }
  }

  .skel {
    background: linear-gradient(90deg, var(--surface) 25%, var(--border) 50%, var(--surface) 75%);
    background-size: 600px 100%;
    animation: skel-shimmer 1.4s ease-in-out infinite;
    border-radius: 4px;
  }

  .skel-card {
    border: 1px solid var(--border);
    border-radius: 8px;
    overflow: hidden;
    background: var(--surface);
  }

  .skel-card-thumb {
    width: 100%;
    padding-top: 56.25%;
  }

  .skel-card-body {
    padding: 8px 10px;
  }

  .skel-line {
    height: 0.8em;
    margin: 6px 0;
  }

  .skel-line.is-short {
    width: 55%;
  }

  .skel-list-item {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    padding: 10px 0;
    border-bottom: 1px solid var(--border);
  }

  .skel-list-thumb {
    width: 120px;
    aspect-ratio: 16 / 9;
    flex: 0 0 auto;
  }

  .skel-list-info {
    flex: 1 1 auto;
    min-width: 0;
    padding-top: 4px;
  }

  .skel-post-cover {
    width: 100%;
    height: 320px;
    margin: 0 0 24px;
  }

  .skel-post-title {
    height: 2.2rem;
    max-width: 70%;
    margin: 0 0 16px;
  }

  .skel-post-line {
    height: 1em;
    margin: 0 0 12px;
  }

  .skel-comment {
    display: flex;
    flex-direction: column;
    gap: 6px;
    margin-bottom: 12px;
  }

  .skel-comment-meta {
    width: 120px;
    height: 0.85rem;
  }

  .skel-comment-line {
    height: 0.88rem;
  }

  .skel-sidebar-item {
    display: flex;
    gap: 10px;
    margin-bottom: 16px;
  }

  .skel-sidebar-thumb {
    width: 84px;
    height: 47px;
    flex: 0 0 auto;
  }

  .skel-sidebar-info {
    flex: 1 1 auto;
    padding-top: 4px;
  }

  /* Section 2 of the listing page: up to 14 more posts as a compact
     thumbnailed list. Reuses styles.css's .blog-latest-extra* classes
     directly (same row pattern the homepage uses for News posts 3-6) --
     only the thumbnail gets a bit wider here since this page has a full
     column's width to spend, not a cramped sidebar. */
  .post-list {
    margin-top: 32px;
  }

  .post-list .blog-latest-extra-thumb {
    width: 120px;
  }

  .post-list-date {
    margin-top: 4px;
    font-size: 0.72rem;
    color: var(--text-faint);
  }

  .pagination {
    display: flex;
    justify-content: center;
    gap: 8px;
    margin-top: 36px;
  }

  .pagination-link {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-width: 36px;
    height: 36px;
    padding: 0 10px;
    border-radius: 6px;
    border: 1px solid var(--border);
    color: var(--text);
    text-decoration: none;
    font-size: 0.85rem;
  }

  .pagination-link:hover {
    border-color: var(--accent);
  }

  .pagination-link.is-active {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }

  .pagination-link.is-disabled {
    opacity: 0.35;
    pointer-events: none;
  }

  @media (max-width: 480px) {
    .post-list-thumb {
      width: 84px;
    }
  }

  /* Single-post view */
  .post-title {
    font-family: "Archivo Black", sans-serif;
    font-weight: 400;
    font-size: clamp(1.8rem, 4.5vw, 2.8rem);
    color: var(--yellow);
    margin: 0 0 10px;
    text-wrap: balance;
  }

  .post-meta {
    color: var(--text-faint);
    font-size: 0.85rem;
    margin: 0 0 24px;
  }

  .post-cover {
    width: 100%;
    max-height: 420px;
    object-fit: cover;
    border-radius: var(--radius);
    margin: 0 0 24px;
    background: var(--accent-soft);
  }

  .post-body {
    font-size: 1.02rem;
  }

  .post-body img {
    max-width: 100%;
    border-radius: 8px;
    display: block;
    margin: 18px 0;
  }

  .post-body .blog-video-embed {
    position: relative;
    width: 100%;
    padding-top: 56.25%;
    margin: 18px 0;
    border-radius: 8px;
    overflow: hidden;
    background: #000;
  }

  .post-body .blog-video-embed iframe {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    border: 0;
  }

  .post-body h1 {
    font-size: 1.7rem;
    margin: 1.2em 0 0.4em;
  }

  .post-body h2 {
    font-size: 1.3rem;
    margin: 1.2em 0 0.4em;
  }

  .post-body h3 {
    font-size: 1.12rem;
    margin: 1.2em 0 0.4em;
  }

  .post-body p {
    margin: 0 0 1em;
  }

  .post-body ul,
  .post-body ol {
    margin: 0 0 1em;
    padding-left: 1.5em;
  }

  .post-body blockquote {
    margin: 0 0 1em;
    padding: 6px 18px;
    border-left: 3px solid var(--accent);
    color: var(--text-muted);
    font-style: italic;
  }

  .post-body a { text-decoration: underline; }

  .back-to-list {
    display: inline-block;
    margin-top: 32px;
    font-size: 0.85rem;
    color: var(--text-muted);
    text-decoration: none;
  }

  .back-to-list:hover { color: var(--accent); }

  /* Widened only for the single-post view (see renderPost() below), which
     needs room for the article + sidebar side by side -- the listing grid
     stays at the narrower default width, it doesn't need it. */
  main.has-sidebar {
    max-width: 1140px;
  }

  .post-layout {
    display: grid;
    grid-template-columns: minmax(0, 1fr) 280px;
    gap: 40px;
    align-items: start;
  }

  .post-sidebar {
    position: sticky;
    top: 20px;
  }

  .post-sidebar-title {
    font-family: "Archivo Black", sans-serif;
    font-weight: 400;
    font-size: 0.95rem;
    color: var(--yellow);
    margin: 0 0 14px;
  }

  .post-sidebar-item {
    display: flex;
    gap: 10px;
    text-decoration: none;
    color: var(--text);
    margin-bottom: 16px;
  }

  .post-sidebar-item img {
    width: 84px;
    height: 47px;
    object-fit: cover;
    border-radius: 6px;
    flex: 0 0 auto;
    background: var(--accent-soft);
  }

  .post-sidebar-item-title {
    font-size: 0.84rem;
    font-weight: 700;
    line-height: 1.3;
  }

  .post-sidebar-item:hover .post-sidebar-item-title {
    color: var(--accent);
  }

  .post-sidebar-empty {
    color: var(--text-faint);
    font-size: 0.85rem;
  }

  @media (max-width: 720px) {
    .post-layout {
      grid-template-columns: 1fr;
    }

    .post-sidebar {
      position: static;
    }
  }

  /* Reuses styles.css's .shell/.app flex layout (sidebar + content side by
     side on desktop) purely for that structural relationship -- this
     page's own <main> already carries its own max-width/padding for the
     article reading width, so .app's default padding would just double up. */
  .app {
    padding: 0;
  }
</style>
</head>

    <div class="skel-card"><div class="skel skel-card-thumb"></div><div class="skel-card-body"><div class="skel skel-line"></div><div class="skel skel-line is-short"></div></div></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>

<script>
(function () {
  "use strict";

  var firebaseConfig = {
    apiKey: "AIzaSyAStHfrJ9NwLfaIclL9ODHFchxMm5MBlMw",
    authDomain: "mvg-library.firebaseapp.com",
    projectId: "mvg-library",
    storageBucket: "mvg-library.firebasestorage.app",
    messagingSenderId: "231351803618",
    appId: "1:231351803618:web:abc5015bccc8361296c8bb",
    measurementId: "G-GS1TQ1CXRZ"
  };
  firebase.initializeApp(firebaseConfig);
  var db = firebase.firestore();
  var auth = firebase.auth();
  var googleProvider = new firebase.auth.GoogleAuthProvider();
  var main = document.getElementById("blogMain");
  var currentUser = null;
  var isAdmin = false;

  function escapeHtml(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  // ---- Skeleton loaders ---------------------------------------------------
  // Shimmering placeholder shapes, sized to match the real markup they stand
  // in for so nothing jumps when the real content swaps in.
  function skeletonCardHtml() {
    return '<div class="skel-card"><div class="skel skel-card-thumb"></div>' +
      '<div class="skel-card-body"><div class="skel skel-line"></div><div class="skel skel-line is-short"></div></div></div>';
  }

  function skeletonCardsHtml(n) {
    var out = "";
    for (var i = 0; i < n; i++) out += skeletonCardHtml();
    return '<div class="post-grid">' + out + "</div>";
  }

  function skeletonListItemHtml() {
    return '<div class="skel-list-item"><div class="skel skel-list-thumb"></div>' +
      '<div class="skel-list-info"><div class="skel skel-line"></div><div class="skel skel-line is-short"></div></div></div>';
  }

  function skeletonListHtml(n) {
    var out = "";
    for (var i = 0; i < n; i++) out += skeletonListItemHtml();
    return '<div class="post-list blog-latest-extra">' + out + "</div>";
  }

  function skeletonPostHtml() {
    return '<div class="post-layout">' +
      '<article>' +
        '<div class="skel skel-post-cover"></div>' +
        '<div class="skel skel-post-title"></div>' +
        '<div class="skel skel-post-line"></div>' +
        '<div class="skel skel-post-line"></div>' +
        '<div class="skel skel-post-line" style="width:80%"></div>' +
        '<div class="skel skel-post-line" style="width:60%"></div>' +
      "</article>" +
      '<aside class="post-sidebar">' +
        '<h2 class="post-sidebar-title">Previous Articles</h2>' +
        skeletonSidebarHtml(3) +
      "</aside>" +
    "</div>";
  }

  function skeletonSidebarItemHtml() {
    return '<div class="skel-sidebar-item"><div class="skel skel-sidebar-thumb"></div>' +
      '<div class="skel-sidebar-info"><div class="skel skel-line"></div></div></div>';
  }

  function skeletonSidebarHtml(n) {
    var out = "";
    for (var i = 0; i < n; i++) out += skeletonSidebarItemHtml();
    return out;
  }

  function skeletonCommentHtml() {
    return '<div class="skel-comment"><div class="skel skel-comment-meta"></div><div class="skel skel-comment-line"></div></div>';
  }

  function skeletonCommentsHtml(n) {
    var out = "";
    for (var i = 0; i < n; i++) out += skeletonCommentHtml();
    return out;
  }

  // ---- In-page video lightbox ---------------------------------------------
  // Blog posts can embed a catalog video as a cover-art card (inserted by
  // the admin blog editor's "+ Video" picker, see app.js's
  // insertBlogVideoCard()) instead of a bare iframe. Its href is a real
  // deep link (works with JS off, middle-click, or landing here from
  // outside the site) but a normal click is intercepted below to open a
  // lightweight lightbox right on top of the post instead of navigating
  // to index.html -- the whole point being to stay on the blog entry.
  // Provider/videoid/title/artist/director are read straight off the
  // card's own data attributes (baked in at insert time) -- a live lookup
  // isn't an option for a signed-out reader: the `videos` collection is
  // admin-read-only, and the public site's own catalog snapshot is a
  // ~24MB JSON, both wrong for "open one video from a blog post."
  function ensureVideoLightboxEl() {
    var el = document.getElementById("blogVideoLightbox");
    if (el) return el;
    el = document.createElement("div");
    el.className = "lightbox";
    el.id = "blogVideoLightbox";
    el.hidden = true;
    el.innerHTML =
      '<div class="lightbox-backdrop"></div>' +
      '<div class="lightbox-panel" role="dialog" aria-modal="true" aria-label="Video">' +
        '<button type="button" class="lightbox-close" aria-label="Close">&times;</button>' +
        '<div class="lightbox-content" id="blogVideoLightboxContent"></div>' +
      "</div>";
    document.body.appendChild(el);
    el.addEventListener("click", function (e) {
      if (e.target.closest(".lightbox-close") || e.target.closest(".lightbox-backdrop")) closeVideoLightbox();
    });
    return el;
  }

  function closeVideoLightbox() {
    var el = document.getElementById("blogVideoLightbox");
    if (!el || el.hidden) return;
    el.hidden = true;
    document.getElementById("blogVideoLightboxContent").innerHTML = ""; // stops playback
    document.body.style.overflow = "";
  }

  function openVideoLightbox(linkEl) {
    var el = ensureVideoLightboxEl();
    var contentEl = document.getElementById("blogVideoLightboxContent");
    var provider = linkEl.getAttribute("data-provider");
    var videoId = linkEl.getAttribute("data-videoid");
    var title = linkEl.getAttribute("data-title") || "";
    var artist = linkEl.getAttribute("data-artist") || "";
    var director = linkEl.getAttribute("data-director") || "";
    var src = provider === "youtube" ? "https://www.youtube.com/embed/" + videoId + "?autoplay=1"
      : provider === "vimeo" ? "https://player.vimeo.com/video/" + videoId + "?autoplay=1"
      : null;
    var videoHtml = src
      ? '<div class="blog-video-embed"><iframe src="' + src + '" title="' + escapeHtml(title) +
        '" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe></div>'
      : '<p class="empty-state">No video available for this entry.</p>';
    var sub = artist ? '<p class="post-meta">' + escapeHtml(artist) + (director ? " · Dir. " + escapeHtml(director) : "") + "</p>" : "";
    contentEl.innerHTML =
      videoHtml +
      '<div class="lightbox-body">' +
      '<h2 class="lightbox-title">' + escapeHtml(title || "(untitled)") + "</h2>" +
      sub +
      "</div>";
    el.hidden = false;
    document.body.style.overflow = "hidden";
  }

  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape") closeVideoLightbox();
  });

  function formatDate(ts) {
    if (!ts || !ts.toDate) return "";
    return ts.toDate().toLocaleDateString(undefined, { year: "numeric", month: "long", day: "numeric" });
  }

  function formatCommentTime(ts) {
    if (!ts || !ts.toDate) return "";
    var date = ts.toDate();
    return date.toLocaleDateString(undefined, { month: "short", day: "numeric" }) + " " +
      date.toLocaleTimeString(undefined, { hour: "numeric", minute: "2-digit" });
  }

  // ---- Blog-post comments -------------------------------------------------
  // Flat `blogComments` collection filtered by postSlug -- same shape/
  // convention as app.js's per-video `comments` (public read, signed-in +
  // not-banned create, admin-only delete). See firestore.rules and the
  // composite (postSlug, createdAt) index it needs.
  var commentsUnsub = null;

  function postCommentsHtml(slug) {
    var composer = currentUser
      ? '<form class="comment-form" id="commentForm" data-slug="' + escapeHtml(slug) + '">' +
          '<textarea id="commentInput" rows="2" maxlength="1000" placeholder="Add a comment…" required></textarea>' +
          '<button type="submit" class="submit-form-btn">Post</button>' +
        "</form>"
      : '<p class="comment-signin-note"><button type="button" class="submit-form-btn" id="commentSignInBtn">Sign in with Google</button> to leave a comment.</p>';
    return '<div class="lightbox-comments">' +
      '<h3 class="lightbox-comments-title">Comments</h3>' +
      composer +
      '<div class="comment-list" id="commentList">' + skeletonCommentsHtml(3) + "</div>" +
    "</div>";
  }

  function renderCommentList(docs) {
    var listEl = document.getElementById("commentList");
    if (!listEl) return; // navigated to another post while this snapshot was in flight
    if (!docs.length) {
      listEl.innerHTML = '<p class="comment-empty">No comments yet — be the first.</p>';
      return;
    }
    listEl.innerHTML = docs.map(function (doc) {
      var d = doc.data();
      var deleteBtn = isAdmin
        ? '<button type="button" class="comment-delete-btn" data-commentid="' + doc.id + '" aria-label="Delete comment" title="Delete comment">&times;</button>'
        : "";
      return '<div class="comment-item">' +
        '<div class="comment-item-meta">' +
          '<span class="comment-item-author">' + escapeHtml(d.authorName || "Anonymous") + "</span>" +
          '<span class="comment-item-time">' + escapeHtml(formatCommentTime(d.createdAt)) + "</span>" +
          deleteBtn +
        "</div>" +
        '<div class="comment-item-text">' + escapeHtml(d.text || "") + "</div>" +
      "</div>";
    }).join("");
  }

  function startCommentsListener(slug) {
    if (commentsUnsub) { commentsUnsub(); commentsUnsub = null; }
    commentsUnsub = db.collection("blogComments").where("postSlug", "==", slug).orderBy("createdAt", "asc").limit(200)
      .onSnapshot(function (snap) {
        renderCommentList(snap.docs);
      }, function (err) {
        console.error("Comments listener failed:", err);
        var listEl = document.getElementById("commentList");
        if (listEl) listEl.innerHTML = '<p class="comment-empty">Couldn\'t load comments.</p>';
      });
  }

  // Reuses styles.css's .spotlight-card/.blog-latest-card classes and
  // their .spotlight-card-thumb/-info/-song/.blog-latest-excerpt children
  // verbatim, so these render identically to the homepage's News cards.
  function postCardHtml(p) {
    var thumb = p.coverImageURL
      ? '<img src="' + escapeHtml(p.coverImageURL) + '" alt="" loading="lazy">'
      : "";
    return '<a class="spotlight-card blog-latest-card" href="blog/' + encodeURIComponent(p.slug) + '/">' +
      '<div class="spotlight-card-thumb">' + thumb + "</div>" +
      '<div class="spotlight-card-info">' +
        '<div class="spotlight-card-song">' + escapeHtml(p.title || "(untitled)") + "</div>" +
        (p.excerpt ? '<div class="blog-latest-excerpt">' + escapeHtml(p.excerpt) + "</div>" : "") +
        '<div class="post-card-date">' + escapeHtml(formatDate(p.publishedAt || p.createdAt)) + "</div>" +
      "</div>" +
    "</a>";
  }

  // Reuses styles.css's .blog-latest-extra-item row pattern (posts 3-6 on
  // the homepage), just with a wider thumbnail -- see .post-list .blog-
  // latest-extra-thumb override above.
  function postListItemHtml(p) {
    var thumb = p.coverImageURL
      ? '<img src="' + escapeHtml(p.coverImageURL) + '" alt="" loading="lazy">'
      : "";
    return '<a class="blog-latest-extra-item" href="blog/' + encodeURIComponent(p.slug) + '/">' +
      '<div class="blog-latest-extra-thumb">' + thumb + "</div>" +
      '<div class="blog-latest-extra-info">' +
        '<div class="blog-latest-extra-title">' + escapeHtml(p.title || "(untitled)") + "</div>" +
        (p.excerpt ? '<div class="blog-latest-excerpt">' + escapeHtml(p.excerpt) + "</div>" : "") +
        '<div class="post-list-date">' + escapeHtml(formatDate(p.publishedAt || p.createdAt)) + "</div>" +
      "</div>" +
    "</a>";
  }

  var POSTS_PER_PAGE = 20;
  var BIG_CARDS_PER_PAGE = 6;

  function paginationHtml(page, totalPages) {
    if (totalPages <= 1) return "";
    var out = ['<nav class="pagination" aria-label="Pagination">'];
    out.push(
      '<a class="pagination-link' + (page <= 1 ? " is-disabled" : "") + '" href="news.html?page=' + (page - 1) + '">&larr;</a>'
    );
    for (var i = 1; i <= totalPages; i++) {
      out.push(
        '<a class="pagination-link' + (i === page ? " is-active" : "") + '" href="news.html' + (i === 1 ? "" : "?page=" + i) + '">' + i + "</a>"
      );
    }
    out.push(
      '<a class="pagination-link' + (page >= totalPages ? " is-disabled" : "") + '" href="news.html?page=' + (page + 1) + '">&rarr;</a>'
    );
    out.push("</nav>");
    return out.join("");
  }

  function sidebarItemHtml(p) {
    var cover = p.coverImageURL
      ? '<img src="' + escapeHtml(p.coverImageURL) + '" alt="" loading="lazy">'
      : '<img src="" alt="" loading="lazy" style="visibility:hidden">';
    return '<a class="post-sidebar-item" href="blog/' + encodeURIComponent(p.slug) + '/">' +
      cover +
      '<span class="post-sidebar-item-title">' + escapeHtml(p.title || "(untitled)") + "</span>" +
    "</a>";
  }

  function renderPostSidebar(excludeSlug) {
    var el = document.getElementById("postSidebarList");
    if (!el) return;
    db.collection("blogPosts").where("status", "==", "published").get().then(function (snap) {
      var el2 = document.getElementById("postSidebarList");
      if (!el2) return; // navigated away while this was loading
      var posts = snap.docs.map(function (doc) { return doc.data(); })
        .filter(function (p) { return p.slug !== excludeSlug; });
      posts.sort(function (a, b) {
        var ta = a.publishedAt || a.createdAt, tb = b.publishedAt || b.createdAt;
        return (tb ? tb.toMillis() : 0) - (ta ? ta.toMillis() : 0);
      });
      posts = posts.slice(0, 6);
      el2.innerHTML = posts.length
        ? posts.map(sidebarItemHtml).join("")
        : '<p class="post-sidebar-empty">No other posts yet.</p>';
    }).catch(function (err) {
      console.error("Loading sidebar posts failed:", err);
      var el3 = document.getElementById("postSidebarList");
      if (el3) el3.innerHTML = "";
    });
  }

  function renderListing(page) {
    page = Math.max(1, page || 1);
    document.title = page > 1 ? "News — Page " + page + " — MVG Library" : "News — MVG Library";
    var canonicalEl = document.getElementById("canonicalLink");
    if (canonicalEl) {
      canonicalEl.setAttribute("href", "https://themusicvideoguy.com/news.html" + (page > 1 ? "?page=" + page : ""));
    }
    main.classList.remove("has-sidebar");
    main.innerHTML =
      '<h1 class="page-title">News</h1>' +
      '<p class="page-intro">News, notes, and features from The Music Video Guy.</p>' +
      '<div id="postsLoading">' + skeletonCardsHtml(BIG_CARDS_PER_PAGE) + skeletonListHtml(5) + "</div>";

    db.collection("blogPosts").where("status", "==", "published").get().then(function (snap) {
      var posts = snap.docs.map(function (doc) { return doc.data(); });
      posts.sort(function (a, b) {
        var ta = a.publishedAt || a.createdAt, tb = b.publishedAt || b.createdAt;
        return (tb ? tb.toMillis() : 0) - (ta ? ta.toMillis() : 0);
      });
      var body = document.getElementById("postsLoading");
      if (!posts.length) {
        body.outerHTML = '<p class="empty-state">No posts yet — check back soon.</p>';
        return;
      }

      var totalPages = Math.max(1, Math.ceil(posts.length / POSTS_PER_PAGE));
      if (page > totalPages) page = totalPages;
      var pageStart = (page - 1) * POSTS_PER_PAGE;
      var pagePosts = posts.slice(pageStart, pageStart + POSTS_PER_PAGE);
      var bigCards = pagePosts.slice(0, BIG_CARDS_PER_PAGE);
      var listPosts = pagePosts.slice(BIG_CARDS_PER_PAGE);

      var html = '<div class="post-grid">' + bigCards.map(postCardHtml).join("") + "</div>";
      if (listPosts.length) {
        html += '<div class="post-list blog-latest-extra">' + listPosts.map(postListItemHtml).join("") + "</div>";
      }
      html += paginationHtml(page, totalPages);
      body.outerHTML = html;
    }).catch(function (err) {
      console.error("Loading posts failed:", err);
      var body = document.getElementById("postsLoading");
      if (body) body.textContent = "Couldn't load posts right now.";
    });
  }

  function renderPost(slug) {
    main.classList.add("has-sidebar");
    main.innerHTML = skeletonPostHtml();
    db.collection("blogPosts").where("slug", "==", slug).where("status", "==", "published").limit(1).get().then(function (snap) {
      if (snap.empty) {
        main.classList.remove("has-sidebar");
        main.innerHTML = '<p class="empty-state">That post doesn\'t exist (or isn\'t published).</p>' +
          '<a class="back-to-list" href="news.html">&larr; Back to all posts</a>';
        return;
      }
      var p = snap.docs[0].data();
      document.title = (p.title || "Post") + " — MVG Library News";
      var descMeta = document.getElementById("metaDescription");
      if (descMeta && p.excerpt) descMeta.setAttribute("content", p.excerpt);
      // Points at the static, crawlable /blog/<slug>/ page generated by
      // scripts/generate-seo-pages.js (real og:image/JSON-LD, no JS
      // required) so Google treats that as the canonical URL for this
      // content instead of this client-rendered query-string view.
      var canonicalEl = document.getElementById("canonicalLink");
      if (canonicalEl) canonicalEl.setAttribute("href", "https://themusicvideoguy.com/blog/" + encodeURIComponent(p.slug) + "/");

      var cover = p.coverImageURL ? '<img class="post-cover" src="' + escapeHtml(p.coverImageURL) + '" alt="">' : "";
      main.innerHTML =
        '<div class="post-layout">' +
          '<article>' +
            cover +
            '<h1 class="post-title">' + escapeHtml(p.title || "(untitled)") + "</h1>" +
            '<p class="post-meta">' + escapeHtml(p.authorName || "The Music Video Guy") +
              (p.publishedAt ? " · " + escapeHtml(formatDate(p.publishedAt)) : "") + "</p>" +
            '<div class="post-body">' + (p.body || "") + "</div>" +
            postCommentsHtml(p.slug) +
            '<a class="back-to-list" href="news.html">&larr; Back to all posts</a>' +
          "</article>" +
          '<aside class="post-sidebar">' +
            '<h2 class="post-sidebar-title">Previous Articles</h2>' +
            '<div id="postSidebarList">' + skeletonSidebarHtml(3) + "</div>" +
          "</aside>" +
        "</div>";
      renderPostSidebar(p.slug);
      startCommentsListener(p.slug);
    }).catch(function (err) {
      console.error("Loading post failed:", err);
      main.classList.remove("has-sidebar");
      main.innerHTML = '<p class="empty-state">Couldn\'t load that post right now.</p>';
    });
  }

  main.addEventListener("click", function (e) {
    var videoCardLink = e.target.closest(".blog-video-card-link");
    if (videoCardLink) {
      e.preventDefault();
      openVideoLightbox(videoCardLink);
      return;
    }
    if (e.target.closest("#commentSignInBtn")) {
      auth.signInWithPopup(googleProvider).catch(function (err) {
        console.error("Sign-in failed:", err);
      });
      return;
    }
    var deleteBtn = e.target.closest(".comment-delete-btn");
    if (deleteBtn) {
      if (!window.confirm("Delete this comment?")) return;
      db.collection("blogComments").doc(deleteBtn.getAttribute("data-commentid")).delete().catch(function (err) {
        console.error("Deleting comment failed:", err);
        alert("Couldn't delete that comment -- please try again.");
      });
    }
  });

  main.addEventListener("submit", function (e) {
    var form = e.target.closest("#commentForm");
    if (!form) return;
    e.preventDefault();
    if (!currentUser) return;
    var input = document.getElementById("commentInput");
    var text = input.value.trim();
    if (!text) return;
    var btn = form.querySelector("button");
    btn.disabled = true;
    db.collection("blogComments").add({
      postSlug: form.getAttribute("data-slug"),
      text: text,
      authorUid: currentUser.uid,
      authorName: currentUser.displayName || currentUser.email || "Anonymous",
      createdAt: firebase.firestore.FieldValue.serverTimestamp()
    }).then(function () {
      input.value = "";
    }).catch(function (err) {
      console.error("Posting comment failed:", err);
      alert("Couldn't post that comment -- please try again.");
    }).finally(function () {
      btn.disabled = false;
    });
  });

  var params = new URLSearchParams(location.search);
  var slug = params.get("post");

  // Auth state isn't known yet on first paint, so render immediately as a
  // signed-out visitor (the common case), then re-render just the post view
  // if auth resolves to a signed-in (and maybe admin) user -- that's the
  // only view with auth-dependent UI (the comment composer / delete button).
  if (slug) renderPost(slug); else renderListing(parseInt(params.get("page"), 10) || 1);

  var authInitDone = false;
  auth.onAuthStateChanged(function (user) {
    currentUser = user;
    // Skip the very first "signed out" callback -- we already rendered
    // that way above, so re-rendering would just refetch the same post for
    // no visible change. Anything after that (signing in, signing out
    // again) does need a re-render to update the comment composer.
    var wasInit = authInitDone;
    authInitDone = true;
    if (!user) {
      isAdmin = false;
      if (slug && wasInit) renderPost(slug);
      return;
    }
    db.collection("admins").doc(user.uid).get().then(function (doc) {
      isAdmin = doc.exists;
      if (isAdmin && window.mvgSiteNav) window.mvgSiteNav.showAdmin();
      if (slug) renderPost(slug);
    }).catch(function (err) {
      console.error("Admin check failed:", err);
      isAdmin = false;
      if (slug) renderPost(slug);
    });
  });
})();
</script>
</body>
</html>
