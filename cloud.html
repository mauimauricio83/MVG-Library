<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script>
  try {
    document.documentElement.setAttribute("data-theme", localStorage.getItem("mvg-theme") || "dark");
  } catch (e) {
    document.documentElement.setAttribute("data-theme", "dark");
  }
</script>
<title>Word Cloud — MVG Library</title>
<meta name="robots" content="noindex, follow">
<link rel="icon" href="icons/icon-192.png">
<link rel="stylesheet" href="styles.css?v=6.9.3">
<link rel="stylesheet" href="hub.css?v=6.9.3">
<style>
  .cloud-page {
    max-width: 980px;
  }

  .cloud-intro {
    margin: -4px 0 8px;
  }

  .cloud-stage {
    position: relative;
    width: 100%;
    height: min(70vh, 640px);
    min-height: 360px;
    perspective: 900px;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  .cloud-sphere {
    position: relative;
    width: 1px;
    height: 1px;
    transform-style: preserve-3d;
  }

  .cloud-word {
    position: absolute;
    top: 0;
    left: 0;
    white-space: nowrap;
    font-weight: 700;
    line-height: 1;
    will-change: transform, opacity;
    user-select: none;
    -webkit-user-select: none;
  }

  .cloud-loading {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    height: 100%;
    color: var(--text-muted);
    font-size: 0.9rem;
  }

  .cloud-loading .spinner {
    width: 26px;
    height: 26px;
    border-radius: 50%;
    border: 3px solid var(--border);
    border-top-color: var(--accent);
    animation: cloud-spin 0.8s linear infinite;
  }

  @keyframes cloud-spin {
    to { transform: rotate(360deg); }
  }

  .cloud-caption {
    text-align: center;
    color: var(--text-faint);
    font-size: 0.8rem;
    margin-top: 4px;
  }
</style>
</head>
<body>
<div class="hub-page cloud-page">
<a class="hub-back" href="index.html">&larr; MVG Library</a>
<h1>Word Cloud</h1>
<p class="hub-intro cloud-intro">Artist, song, and director names from our latest submissions, sized by how often they show up.</p>

<div class="cloud-stage" id="cloudStage">
  <div class="cloud-loading" id="cloudLoading">
    <span class="spinner"></span>
    <span>Building the cloud…</span>
  </div>
</div>
<p class="cloud-caption">Drag to spin · scroll to zoom</p>

</div>
<script src="cloud.js"></script>
</body>
</html>
