<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script>
  try {
    document.documentElement.setAttribute("data-theme", localStorage.getItem("mvg-theme") || "dark");
  } catch (e) {
    document.documentElement.setAttribute("data-theme", "dark");
  }
</script>
<title>Blog — MVG Library</title>
<meta id="metaDescription" name="description" content="News, notes, and features from The Music Video Guy.">
<meta name="robots" content="index, follow">
<link rel="icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-8223299314215910" crossorigin="anonymous"></script>
<style>
  :root {
    --bg: #121214;
    --surface: #1b1b1e;
    --border: #2c2c30;
    --text: #f1f1f2;
    --text-muted: #a5a5ad;
    --text-faint: #77777f;
    --accent: #a855f7;
    --accent-soft: #2a1150;
    --yellow: #f5e300;
    --radius: 10px;
  }
  :root[data-theme="light"] {
    --bg: #fafafa;
    --surface: #ffffff;
    --border: #e4e4e7;
    --text: #18181b;
    --text-muted: #6b6b73;
    --text-faint: #9a9aa2;
    --accent: #4a0d8f;
    --accent-soft: #efe4fb;
    --yellow: #a68900;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
  }

  body {
    font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    line-height: 1.6;
  }

  a { color: var(--accent); }

  /* No max-width by default -- the listing view should fill .app's full
     width exactly like the homepage's News section does (that section's
     .blog-latest-sidebar lives directly in .app, which has no cap of its
     own). Only the single-post reading view constrains width, via
     main.has-sidebar below. */
  main {
    margin: 0 auto;
    padding: 32px 20px 80px;
  }

  .page-title {
    font-family: "Archivo Black", sans-serif;
    font-weight: 400;
    font-size: clamp(1.8rem, 4vw, 2.6rem);
    color: var(--yellow);
    margin: 0 0 8px;
  }

  .page-intro {
    color: var(--text-muted);
    margin: 0 0 32px;
    max-width: 60ch;
  }

  /* The 6 big cards reuse styles.css's .spotlight-card / .blog-latest-card
     (and their .spotlight-card-thumb / .spotlight-card-info /
     .spotlight-card-song / .blog-latest-excerpt children) directly, so
     they render pixel-identical to the homepage's "News" cards -- just in
     a wider 3-column grid since this page has the full width to use,
     instead of the homepage sidebar's cramped 2 columns. */
  .post-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 20px;
    margin-bottom: 8px;
  }

  .post-card-date {
    margin-top: 4px;
    font-size: 0.72rem;
    color: var(--text-faint);
  }

  @media (max-width: 900px) {
    .post-grid {
      grid-template-columns: repeat(2, 1fr);
    }
  }

  @media (max-width: 560px) {
    .post-grid {
      grid-template-columns: 1fr;
    }
  }

  .empty-state, .loading-state {
    color: var(--text-faint);
    padding: 40px 0;
    text-align: center;
  }

  /* Section 2 of the listing page: up to 14 more posts as a compact
     thumbnailed list. Reuses styles.css's .blog-latest-extra* classes
     directly (same row pattern the homepage uses for News posts 3-6) --
     only the thumbnail gets a bit wider here since this page has a full
     column's width to spend, not a cramped sidebar. */
  .post-list {
    margin-top: 32px;
  }

  .post-list .blog-latest-extra-thumb {
    width: 120px;
  }

  .post-list-date {
    margin-top: 4px;
    font-size: 0.72rem;
    color: var(--text-faint);
  }

  .pagination {
    display: flex;
    justify-content: center;
    gap: 8px;
    margin-top: 36px;
  }

  .pagination-link {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-width: 36px;
    height: 36px;
    padding: 0 10px;
    border-radius: 6px;
    border: 1px solid var(--border);
    color: var(--text);
    text-decoration: none;
    font-size: 0.85rem;
  }

  .pagination-link:hover {
    border-color: var(--accent);
  }

  .pagination-link.is-active {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }

  .pagination-link.is-disabled {
    opacity: 0.35;
    pointer-events: none;
  }

  @media (max-width: 480px) {
    .post-list-thumb {
      width: 84px;
    }
  }

  /* Single-post view */
  .post-title {
    font-family: "Archivo Black", sans-serif;
    font-weight: 400;
    font-size: clamp(1.8rem, 4.5vw, 2.8rem);
    color: var(--yellow);
    margin: 0 0 10px;
    text-wrap: balance;
  }

  .post-meta {
    color: var(--text-faint);
    font-size: 0.85rem;
    margin: 0 0 24px;
  }

  .post-cover {
    width: 100%;
    max-height: 420px;
    object-fit: cover;
    border-radius: var(--radius);
    margin: 0 0 24px;
    background: var(--accent-soft);
  }

  .post-body {
    font-size: 1.02rem;
  }

  .post-body img {
    max-width: 100%;
    border-radius: 8px;
    display: block;
    margin: 18px 0;
  }

  .post-body .blog-video-embed {
    position: relative;
    width: 100%;
    padding-top: 56.25%;
    margin: 18px 0;
    border-radius: 8px;
    overflow: hidden;
    background: #000;
  }

  .post-body .blog-video-embed iframe {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    border: 0;
  }

  .post-body h1 {
    font-size: 1.7rem;
    margin: 1.2em 0 0.4em;
  }

  .post-body h2 {
    font-size: 1.3rem;
    margin: 1.2em 0 0.4em;
  }

  .post-body h3 {
    font-size: 1.12rem;
    margin: 1.2em 0 0.4em;
  }

  .post-body p {
    margin: 0 0 1em;
  }

  .post-body ul,
  .post-body ol {
    margin: 0 0 1em;
    padding-left: 1.5em;
  }

  .post-body blockquote {
    margin: 0 0 1em;
    padding: 6px 18px;
    border-left: 3px solid var(--accent);
    color: var(--text-muted);
    font-style: italic;
  }

  .post-body a { text-decoration: underline; }

  .back-to-list {
    display: inline-block;
    margin-top: 32px;
    font-size: 0.85rem;
    color: var(--text-muted);
    text-decoration: none;
  }

  .back-to-list:hover { color: var(--accent); }

  /* Widened only for the single-post view (see renderPost() below), which
     needs room for the article + sidebar side by side -- the listing grid
     stays at the narrower default width, it doesn't need it. */
  main.has-sidebar {
    max-width: 1140px;
  }

  .post-layout {
    display: grid;
    grid-template-columns: minmax(0, 1fr) 280px;
    gap: 40px;
    align-items: start;
  }

  .post-sidebar {
    position: sticky;
    top: 20px;
  }

  .post-sidebar-title {
    font-family: "Archivo Black", sans-serif;
    font-weight: 400;
    font-size: 0.95rem;
    color: var(--yellow);
    margin: 0 0 14px;
  }

  .post-sidebar-item {
    display: flex;
    gap: 10px;
    text-decoration: none;
    color: var(--text);
    margin-bottom: 16px;
  }

  .post-sidebar-item img {
    width: 84px;
    height: 47px;
    object-fit: cover;
    border-radius: 6px;
    flex: 0 0 auto;
    background: var(--accent-soft);
  }

  .post-sidebar-item-title {
    font-size: 0.84rem;
    font-weight: 700;
    line-height: 1.3;
  }

  .post-sidebar-item:hover .post-sidebar-item-title {
    color: var(--accent);
  }

  .post-sidebar-empty {
    color: var(--text-faint);
    font-size: 0.85rem;
  }

  @media (max-width: 720px) {
    .post-layout {
      grid-template-columns: 1fr;
    }

    .post-sidebar {
      position: static;
    }
  }

  /* Reuses styles.css's .shell/.app flex layout (sidebar + content side by
     side on desktop) purely for that structural relationship -- this
     page's own <main> already carries its own max-width/padding for the
     article reading width, so .app's default padding would just double up. */
  .app {
    padding: 0;
  }
</style>
</head>
<body>

<div class="shell">
<script src="site-nav.js"></script>
<div class="app">

<main id="blogMain">
  <div class="loading-state">Loading…</div>
</main>

<div class="ad-placeholder" style="max-width:860px;margin:0 auto 40px;padding:0 20px;">
  <a href="https://hisong.io/MUSICVIDEOGUY5" target="_blank" rel="noopener noreferrer">
    <img class="ad-image" src="https://images.squarespace-cdn.com/content/6280a1062dd56f7434ce1d85/205146cf-b9ae-4b31-874b-0bf0975d1b93/promocode.png?content-type=image%2Fpng" alt="Promo code — use code MUSICVIDEOGUY5">
  </a>
</div>

</div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
(function () {
  "use strict";

  var firebaseConfig = {
    apiKey: "AIzaSyAStHfrJ9NwLfaIclL9ODHFchxMm5MBlMw",
    authDomain: "mvg-library.firebaseapp.com",
    projectId: "mvg-library",
    storageBucket: "mvg-library.firebasestorage.app",
    messagingSenderId: "231351803618",
    appId: "1:231351803618:web:abc5015bccc8361296c8bb",
    measurementId: "G-GS1TQ1CXRZ"
  };
  firebase.initializeApp(firebaseConfig);
  var db = firebase.firestore();
  var main = document.getElementById("blogMain");

  function escapeHtml(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  function formatDate(ts) {
    if (!ts || !ts.toDate) return "";
    return ts.toDate().toLocaleDateString(undefined, { year: "numeric", month: "long", day: "numeric" });
  }

  // Reuses styles.css's .spotlight-card/.blog-latest-card classes and
  // their .spotlight-card-thumb/-info/-song/.blog-latest-excerpt children
  // verbatim, so these render identically to the homepage's News cards.
  function postCardHtml(p) {
    var thumb = p.coverImageURL
      ? '<img src="' + escapeHtml(p.coverImageURL) + '" alt="" loading="lazy">'
      : "";
    return '<a class="spotlight-card blog-latest-card" href="blog.html?post=' + encodeURIComponent(p.slug) + '">' +
      '<div class="spotlight-card-thumb">' + thumb + "</div>" +
      '<div class="spotlight-card-info">' +
        '<div class="spotlight-card-song">' + escapeHtml(p.title || "(untitled)") + "</div>" +
        (p.excerpt ? '<div class="blog-latest-excerpt">' + escapeHtml(p.excerpt) + "</div>" : "") +
        '<div class="post-card-date">' + escapeHtml(formatDate(p.publishedAt || p.createdAt)) + "</div>" +
      "</div>" +
    "</a>";
  }

  // Reuses styles.css's .blog-latest-extra-item row pattern (posts 3-6 on
  // the homepage), just with a wider thumbnail -- see .post-list .blog-
  // latest-extra-thumb override above.
  function postListItemHtml(p) {
    var thumb = p.coverImageURL
      ? '<img src="' + escapeHtml(p.coverImageURL) + '" alt="" loading="lazy">'
      : "";
    return '<a class="blog-latest-extra-item" href="blog.html?post=' + encodeURIComponent(p.slug) + '">' +
      '<div class="blog-latest-extra-thumb">' + thumb + "</div>" +
      '<div class="blog-latest-extra-info">' +
        '<div class="blog-latest-extra-title">' + escapeHtml(p.title || "(untitled)") + "</div>" +
        (p.excerpt ? '<div class="blog-latest-excerpt">' + escapeHtml(p.excerpt) + "</div>" : "") +
        '<div class="post-list-date">' + escapeHtml(formatDate(p.publishedAt || p.createdAt)) + "</div>" +
      "</div>" +
    "</a>";
  }

  var POSTS_PER_PAGE = 20;
  var BIG_CARDS_PER_PAGE = 6;

  function paginationHtml(page, totalPages) {
    if (totalPages <= 1) return "";
    var out = ['<nav class="pagination" aria-label="Pagination">'];
    out.push(
      '<a class="pagination-link' + (page <= 1 ? " is-disabled" : "") + '" href="blog.html?page=' + (page - 1) + '">&larr;</a>'
    );
    for (var i = 1; i <= totalPages; i++) {
      out.push(
        '<a class="pagination-link' + (i === page ? " is-active" : "") + '" href="blog.html' + (i === 1 ? "" : "?page=" + i) + '">' + i + "</a>"
      );
    }
    out.push(
      '<a class="pagination-link' + (page >= totalPages ? " is-disabled" : "") + '" href="blog.html?page=' + (page + 1) + '">&rarr;</a>'
    );
    out.push("</nav>");
    return out.join("");
  }

  function sidebarItemHtml(p) {
    var cover = p.coverImageURL
      ? '<img src="' + escapeHtml(p.coverImageURL) + '" alt="" loading="lazy">'
      : '<img src="" alt="" loading="lazy" style="visibility:hidden">';
    return '<a class="post-sidebar-item" href="blog.html?post=' + encodeURIComponent(p.slug) + '">' +
      cover +
      '<span class="post-sidebar-item-title">' + escapeHtml(p.title || "(untitled)") + "</span>" +
    "</a>";
  }

  function renderPostSidebar(excludeSlug) {
    var el = document.getElementById("postSidebarList");
    if (!el) return;
    db.collection("blogPosts").where("status", "==", "published").get().then(function (snap) {
      var el2 = document.getElementById("postSidebarList");
      if (!el2) return; // navigated away while this was loading
      var posts = snap.docs.map(function (doc) { return doc.data(); })
        .filter(function (p) { return p.slug !== excludeSlug; });
      posts.sort(function (a, b) {
        var ta = a.publishedAt || a.createdAt, tb = b.publishedAt || b.createdAt;
        return (tb ? tb.toMillis() : 0) - (ta ? ta.toMillis() : 0);
      });
      posts = posts.slice(0, 6);
      el2.innerHTML = posts.length
        ? posts.map(sidebarItemHtml).join("")
        : '<p class="post-sidebar-empty">No other posts yet.</p>';
    }).catch(function (err) {
      console.error("Loading sidebar posts failed:", err);
      var el3 = document.getElementById("postSidebarList");
      if (el3) el3.innerHTML = "";
    });
  }

  function renderListing(page) {
    page = Math.max(1, page || 1);
    document.title = page > 1 ? "Blog — Page " + page + " — MVG Library" : "Blog — MVG Library";
    main.classList.remove("has-sidebar");
    main.innerHTML =
      '<h1 class="page-title">Blog</h1>' +
      '<p class="page-intro">News, notes, and features from The Music Video Guy.</p>' +
      '<div class="loading-state">Loading posts…</div>';

    db.collection("blogPosts").where("status", "==", "published").get().then(function (snap) {
      var posts = snap.docs.map(function (doc) { return doc.data(); });
      posts.sort(function (a, b) {
        var ta = a.publishedAt || a.createdAt, tb = b.publishedAt || b.createdAt;
        return (tb ? tb.toMillis() : 0) - (ta ? ta.toMillis() : 0);
      });
      var body = document.querySelector(".loading-state");
      if (!posts.length) {
        body.outerHTML = '<p class="empty-state">No posts yet — check back soon.</p>';
        return;
      }

      var totalPages = Math.max(1, Math.ceil(posts.length / POSTS_PER_PAGE));
      if (page > totalPages) page = totalPages;
      var pageStart = (page - 1) * POSTS_PER_PAGE;
      var pagePosts = posts.slice(pageStart, pageStart + POSTS_PER_PAGE);
      var bigCards = pagePosts.slice(0, BIG_CARDS_PER_PAGE);
      var listPosts = pagePosts.slice(BIG_CARDS_PER_PAGE);

      var html = '<div class="post-grid">' + bigCards.map(postCardHtml).join("") + "</div>";
      if (listPosts.length) {
        html += '<div class="post-list blog-latest-extra">' + listPosts.map(postListItemHtml).join("") + "</div>";
      }
      html += paginationHtml(page, totalPages);
      body.outerHTML = html;
    }).catch(function (err) {
      console.error("Loading posts failed:", err);
      var body = document.querySelector(".loading-state");
      if (body) body.textContent = "Couldn't load posts right now.";
    });
  }

  function renderPost(slug) {
    main.classList.remove("has-sidebar");
    main.innerHTML = '<div class="loading-state">Loading…</div>';
    db.collection("blogPosts").where("slug", "==", slug).where("status", "==", "published").limit(1).get().then(function (snap) {
      if (snap.empty) {
        main.innerHTML = '<p class="empty-state">That post doesn\'t exist (or isn\'t published).</p>' +
          '<a class="back-to-list" href="blog.html">&larr; Back to all posts</a>';
        return;
      }
      var p = snap.docs[0].data();
      document.title = (p.title || "Post") + " — MVG Library Blog";
      var descMeta = document.getElementById("metaDescription");
      if (descMeta && p.excerpt) descMeta.setAttribute("content", p.excerpt);

      var cover = p.coverImageURL ? '<img class="post-cover" src="' + escapeHtml(p.coverImageURL) + '" alt="">' : "";
      main.classList.add("has-sidebar");
      main.innerHTML =
        '<div class="post-layout">' +
          '<article>' +
            cover +
            '<h1 class="post-title">' + escapeHtml(p.title || "(untitled)") + "</h1>" +
            '<p class="post-meta">' + escapeHtml(p.authorName || "The Music Video Guy") +
              (p.publishedAt ? " · " + escapeHtml(formatDate(p.publishedAt)) : "") + "</p>" +
            '<div class="post-body">' + (p.body || "") + "</div>" +
            '<a class="back-to-list" href="blog.html">&larr; Back to all posts</a>' +
          "</article>" +
          '<aside class="post-sidebar">' +
            '<h2 class="post-sidebar-title">Previous Articles</h2>' +
            '<div id="postSidebarList"><p class="post-sidebar-empty">Loading…</p></div>' +
          "</aside>" +
        "</div>";
      renderPostSidebar(p.slug);
    }).catch(function (err) {
      console.error("Loading post failed:", err);
      main.innerHTML = '<p class="empty-state">Couldn\'t load that post right now.</p>';
    });
  }

  var params = new URLSearchParams(location.search);
  var slug = params.get("post");
  if (slug) renderPost(slug);
  else renderListing(parseInt(params.get("page"), 10) || 1);
})();
</script>
</body>
</html>
