name: Fetch latest blog posts

on:
  schedule:
    # Hourly, offset to :15 past the hour so it never lands on the same
    # minute as build-seo-pages.yml's daily 06:00 run (both push to the
    # same branch -- overlapping pushes would race). Unlike that workflow
    # (which regenerates ~13k static files and only affects SEO
    # crawlability), this feeds the homepage's News section directly, so
    # it's worth checking often. The fetch itself is cheap: one small JSON
    # request to Squarespace, 3 items, no heavy file generation -- nothing
    # like generate-seo-pages.js's cost.
    - cron: "15 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch latest blog posts
        run: node scripts/fetch-blog-latest.js

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add blog-latest.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update latest blog posts [automated]"
            git push
          fi
